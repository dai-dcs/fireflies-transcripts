# Add this location block inside the EXISTING server { ... } block for
# dashboards.decirclesolar.com (the one your other app already runs under).
# Do not create a new server block — nginx would just ignore the duplicate
# for this domain/port.
#
# The trailing slashes on both `location` and `proxy_pass` matter: they make
# nginx strip the /fireflies prefix before forwarding, so a request to
#   https://dashboards.decirclesolar.com/fireflies/webhooks/fireflies
# arrives at the FastAPI app as
#   http://127.0.0.1:8787/webhooks/fireflies
# which is exactly the route app.py already exposes — no code change needed.

    location /fireflies/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fireflies expects a fast ack; the app already off-loads the actual
        # fetch+upload work to a background task, but give it a little
        # headroom anyway in case of slow upstream responses.
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
